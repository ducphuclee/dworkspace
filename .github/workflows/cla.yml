name: CLA

# Asks for a signature on a first pull request and records it in this
# repository. See CLA.md for what is being signed and CONTRIBUTING.md for why.
#
# It runs on the pull_request_target event rather than pull_request, because it
# has to write the signature file and a fork's token cannot. That event runs
# with the BASE repository's permissions, so nothing from the fork is ever
# checked out or executed here, only the comment and the signature list.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

# actions: write is what turns the check green once somebody signs: the action
# re-runs the pull request's own CLA run, and without the permission that call
# failed ("Resource not accessible by integration"). Every first pull request
# kept a red CLA mark beside a valid signature until its next push.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # A comment counts on a pull request only: the signature itself, or
    # "recheck", which the bot itself suggests, to run the check again.
    if: >
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         contains(github.event.comment.body, 'I have read the CLA')))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: .github/cla-signatures.json
          path-to-document: https://github.com/saltmd/salt.md/blob/main/CLA.md
          branch: main
          allowlist: jeremiaa,dependabot[bot]
          custom-notsigned-prcomment: >
            Thank you for the pull request. Before it can be merged, please read
            the [CLA](https://github.com/saltmd/salt.md/blob/main/CLA.md) and
            sign it by posting exactly this as a comment:
          custom-pr-sign-comment: 'I have read the CLA and I hereby sign it.'
          custom-allsigned-prcomment: 'Signed, thank you. On to the review.'
